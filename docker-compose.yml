name: tradenote
services:
  tradenote:
    image: eleventrading/tradenote
    container_name: tradenote_app
    ports:
      - 8080:8080
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      MONGO_URI: ${MONGO_URI}
      TRADENOTE_DATABASE: ${TRADENOTE_DATABASE}
      APP_ID: ${APP_ID}
      MASTER_KEY: ${MASTER_KEY}
      TRADENOTE_PORT: ${TRADENOTE_PORT}
      TRADENOTE_USER: ${TRADENOTE_USER:-}
      TRADENOTE_PASSWORD: ${TRADENOTE_PASSWORD:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
