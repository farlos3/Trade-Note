; Copy this file to config.ini and fill in your values.
; config.ini holds secrets (MT5 password, API key) and is gitignored.

[mt5]
# The broker's daylight-saving calendar: eu | us | none (default none).
# MT5 only reports TODAY's clock offset; this rule supplies the offset that applied
# to older deals. Most GMT+2/+3 servers follow eu (HFMarkets does).
broker_dst = eu
; How the sync reaches MT5.
;   auto    (default) native on Windows, bridge everywhere else
;   native  the MetaTrader5 Python package -- Windows only, it is a Windows wheel
;   bridge  read the JSON the TradeNoteExport EA writes from inside the terminal.
;           The only option on macOS/Linux. See README.md to install the EA.
; backend = auto
; Optional: explicit path to the EA's export file. Left blank the sync finds it
; itself, including inside MT5-for-Mac's Wine bottle and portable installs.
; bridge_file =
;
; login/password/server are used by the NATIVE backend only. Leave them BLANK to
; use the terminal that is already open and logged in. The bridge backend always
; uses whatever account the terminal running the EA is logged into.
;
; Leaving them blank is also how MORE THAN ONE ACCOUNT works: switch the terminal's
; login and the next run follows it. state.json keeps a separate watermark per
; login, so switching back does not hide the other account's trades. Filling these
; in pins the sync to one account. See README.md -> "More than one MT5 account".
login =
password =
server =
; Optional: full path to terminal64.exe if the script can't find it automatically.
; terminal_path = C:\Program Files\MetaTrader 5\terminal64.exe

[tradenote]
; Local TradeNote instance (or your Render URL).
url = http://localhost:8080
; The TradeNote API key from Settings -> API Keys (provider "tradeNote").
api_key = PUT_YOUR_TRADENOTE_API_KEY_HERE

[sync]
; Size of the sliding window re-sent every run, in days. Each run pulls all deals
; from this many days ago up to now (padded into the future for broker time) and
; lets TradeNote dedup (re-sending is safe, also for a wide window).
lookback_days = 2
; Catch-up: when TradeNote's newest trade for the account is older than that window
; (the machine was off, or this is a new machine) the window automatically starts a
; day before it, so everything missed is sent. This is the furthest back it will go;
; for a longer gap run once with  mt5_sync.py --lookback-days N  (which is used as
; written). Needs broker_dst set above, or a gap crossing a DST switch shifts old
; deals by an hour.
max_catchup_days = 90

[notify]
; Send a reminder email after new deals are synced (add screenshots / notes).
; Set enabled = false to turn it off.
enabled = true
smtp_host = smtp.gmail.com
smtp_port = 587
; Gmail address that sends AND receives the reminder.
sender = you@gmail.com
recipient = you@gmail.com
; Gmail App Password (Google Account -> Security -> App passwords).
; Leave blank to read it from the GMAIL_APP_PASSWORD environment variable instead.
app_password = PUT_YOUR_GMAIL_APP_PASSWORD_HERE
