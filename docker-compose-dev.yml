name: tradenote
# DEV stack: runs the app in Vite dev mode with hot-reload.
# Source code is bind-mounted, so frontend edits show up instantly (no rebuild).
# Backend (index.mjs) changes still need a container restart:
#   docker compose -f docker-compose-dev.yml restart tradenote
#
# Start:  docker compose -f docker-compose-dev.yml up -d --build
# Logs:   docker compose -f docker-compose-dev.yml logs -f tradenote
services:
  mongo:
    image: mongo:7
    container_name: tradenote_mongo
    restart: unless-stopped
    # Not started by default: the primary database is MongoDB Atlas (MONGO_URI in
    # .env). Opt back in for an offline local DB with
    #   docker compose -f docker-compose-dev.yml --profile localdb up -d
    # and point MONGO_URI at mongodb://...@mongo:27017.
    profiles: ["localdb"]
    # Loopback only: it used to be published on every interface.
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - mongo_data:/data/db

  tradenote:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    image: tradenote:local
    container_name: tradenote_app
    restart: unless-stopped
    ports:
      - 8080:8080
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["node", "index.mjs"]
    volumes:
      # Live source for hot-reload...
      - .:/app
      # ...but keep the image's node_modules (host has none)
      - /app/node_modules
    # Lets the container reach services on the host by name -- the Claude bridge
    # above all. Docker Desktop provides this name itself on some setups; on others
    # (and on Linux) it has to be declared, and declaring it is harmless everywhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # dev  = Vite dev server, hot-reload, but every page load re-fetches ~90
      #        unbundled modules (slow navigation).
      # prod = serves the pre-built dist/ (bundled, minified, hash-cached) -- much
      #        faster, but source edits need `npx vite build` to show up.
      # Override per run:  NODE_ENV=prod docker compose -f docker-compose-dev.yml up -d
      NODE_ENV: ${NODE_ENV:-dev}
      MONGO_URI: ${MONGO_URI}
      TRADENOTE_DATABASE: ${TRADENOTE_DATABASE}
      APP_ID: ${APP_ID}
      MASTER_KEY: ${MASTER_KEY}
      TRADENOTE_PORT: ${TRADENOTE_PORT}
      TRADENOTE_USER: ${TRADENOTE_USER:-}
      TRADENOTE_PASSWORD: ${TRADENOTE_PASSWORD:-}
      # Optional — enables the LLM analysis on the AI Analysis page (billed per
      # token, separate from a Claude subscription). Leave unset to keep it off.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      # AI_PROVIDER=claude-cli: use your Claude SUBSCRIPTION through the host-side
      # bridge (scripts/claude-bridge.mjs), started by ./tradenote.sh start.
      CLAUDE_BRIDGE_SECRET: ${CLAUDE_BRIDGE_SECRET:-}
      CLAUDE_BRIDGE_URL: ${CLAUDE_BRIDGE_URL:-}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-}
      # Per-trade lot at/above which a trade counts as "oversized" in the
      # Overtrading flag (default 0.1). Set to your own normal size + margin.
      OVERTRADE_LOT_CAP: ${OVERTRADE_LOT_CAP:-}
      # MT5 trades are filed under the TRADE timezone's day only when this is
      # "trade-tz". Set by mt5-sync/rebucket_days.py --source mt5 --apply, which
      # re-files the stored history in the same step; do not set it by hand.
      MT5_DAY_BUCKETS: ${MT5_DAY_BUCKETS:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}

volumes:
  mongo_data:
