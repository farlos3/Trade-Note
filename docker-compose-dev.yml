name: tradenote
# DEV stack: runs the app in Vite dev mode with hot-reload.
# Source code is bind-mounted, so frontend edits show up instantly (no rebuild).
# Backend (index.mjs) changes still need a container restart:
#   docker compose -f docker-compose-dev.yml restart tradenote
#
# Start:  docker compose -f docker-compose-dev.yml up -d --build
# Logs:   docker compose -f docker-compose-dev.yml logs -f tradenote
services:
  tradenote:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    image: tradenote:local
    container_name: tradenote_app
    restart: unless-stopped
    ports:
      - 8080:8080
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["node", "index.mjs"]
    volumes:
      # Live source for hot-reload...
      - .:/app
      # ...but keep the image's node_modules (host has none)
      - /app/node_modules
    environment:
      NODE_ENV: dev
      MONGO_URI: ${MONGO_URI}
      TRADENOTE_DATABASE: ${TRADENOTE_DATABASE}
      APP_ID: ${APP_ID}
      MASTER_KEY: ${MASTER_KEY}
      TRADENOTE_PORT: ${TRADENOTE_PORT}
      TRADENOTE_USER: ${TRADENOTE_USER:-}
      TRADENOTE_PASSWORD: ${TRADENOTE_PASSWORD:-}
      TRADENOTE_AUTO_LOGIN: ${TRADENOTE_AUTO_LOGIN:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
