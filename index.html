<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link rel="icon" type="image/png" href="src/assets/sun_full_blue.png"/>
    <!--<link rel="manifest" href="/manifest.json">-->
    <!-- Paint the app's real dark background before any stylesheet below has loaded,
         so a full page navigation (this app reloads the document on every nav, see
         SideMenu.vue) never shows a flash of browser-default white while CSS is
         still in flight. Matches --black-bg-0 in style-dark.css. -->
    <style>html,body{background-color:#0e1015;}</style>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans&display=swap" rel="stylesheet">
    <!-- Pinned to a resolved version, not @latest: jsdelivr serves pinned package
         versions as immutable with a 1-year cache (vs. ~12h for @latest, which also
         costs an extra version-resolution lookup on every request). Since every nav
         in this app is a full document reload, that resolution + short cache was
         being paid on every single page. See useGetPeriods()/useReconcileSelectedDateRange
         comments for the equivalent "full reload" assumption elsewhere in the app. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@iconscout/unicons@4.2.0/css/line.css">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.0-rc.5/dist/quill.snow.css" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.0-rc.5/dist/quill.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
