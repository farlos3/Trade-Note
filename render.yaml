# Render Blueprint for TradeNote
# Docs: https://render.com/docs/blueprint-spec
#
# Builds from THIS repo's Dockerfile, not the upstream published image: the app
# here has diverged (Live page + MetaApi source, journal push, plan/breakeven
# analytics, week notes), and `image:` would silently deploy vanilla TradeNote
# with none of it.
#
# How to deploy:
#   1. Push this repo to GitHub (render.yaml must be in the repo root).
#   2. On Render: New + -> Blueprint -> connect this repo.
#   3. Fill in the `sync: false` secrets in the dashboard when prompted.
#
# MT5 data on a cloud host:
#   MetaTrader 5 runs on YOUR Windows machine, not here. That machine pushes to this
#   service over HTTPS: set `[tradenote] url` in mt5-sync/config.ini to this service's
#   URL and run  mt5-sync/mt5-agent.sh start  (the every-minute sync is the scheduled
#   task). The account being synced must be listed in Settings -> "MT5 accounts
#   allowed to sync" or the server refuses it. No MetaApi, nothing to deploy for MT5.
#
# Secrets use `sync: false` so they are NEVER stored in git - you enter them once
# in the Render dashboard.

services:
  - type: web
    name: tradenote
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    region: singapore        # closest region to Thailand
    # The free plan sleeps after 15 minutes without a request, and the first request
    # after that waits ~30-60 s for it to wake. While MT5 is open on your machine the
    # sync (every minute) and the live feed (every second) keep it awake; with the
    # machine off it sleeps, and opening the site wakes it. The live feed's state is
    # in memory only, so a wake-up starts with an empty Live page until MT5 pushes.
    # Move to `starter` if that wait or restarts become a nuisance.
    plan: free
    # "/" and not /api/parseAppId: that route is POST-only, and a health check is a
    # GET. Note the app binds its port BEFORE Parse Server finishes connecting to
    # Mongo, and only registers routes after -- so if Atlas refuses the connection
    # (its Network Access list must allow this service) the port answers but every
    # path 404s, and the failing health check is what surfaces it.
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: prod           # serve the built dist/, not the Vite dev server
      - key: TRADENOTE_DATABASE
        value: tradenote
      - key: TRADENOTE_PORT
        value: "10000"        # Render routes to this port (matches its default PORT)

      # --- Database (MongoDB Atlas) ---
      # Atlas Network Access must allow Render's egress. Either 0.0.0.0/0, or the
      # static outbound IPs Render lists for this service's region.
      - key: MONGO_URI
        sync: false           # the READ/WRITE user's URI WITH the db name:
                              #   mongodb+srv://tradenote_app:<pw>@cluster0.xxxx.mongodb.net/tradenote?retryWrites=true&w=majority
                              # (the ATLAS_APP_URI line in your local .env). Without /tradenote the
                              # app reads the empty default database and every login fails.

      # --- Parse ---
      # Generated by Render, NOT copied from the local .env. MASTER_KEY bypasses
      # every Parse permission check, so on a public URL it has to be long and
      # random; the local values are 6 characters, which is fine on a LAN and
      # nowhere near enough here. generateValue also keeps them out of git and out
      # of any chat/terminal history.
      - key: APP_ID
        generateValue: true
      - key: MASTER_KEY
        generateValue: true

      # --- Login ---
      # Nothing in this codebase reads TRADENOTE_AUTO_LOGIN any more -- every visit
      # needs the account password. Kept "false" so that if an auto-login is ever
      # added back it cannot be switched on here by accident: on a public URL it would
      # sign every visitor in.
      - key: TRADENOTE_AUTO_LOGIN
        value: "false"
      # Close public signup, or anyone can create an account on this instance.
      - key: REGISTER_OFF
        value: "true"

      # OPTIONAL. seedLoginUser() creates/maintains the account you log in AS, and
      # is skipped entirely when either is unset. The user already exists in the
      # Atlas database this service points at, so you can simply log in and leave
      # both blank. Set them only to force a password reset at boot -- and then the
      # username must match the existing one EXACTLY, because a name that does not
      # exist yet is created as a brand new (empty) account instead.
      - key: TRADENOTE_USER
        sync: false
      - key: TRADENOTE_PASSWORD
        sync: false

      # --- Cloudflare R2: the PUBLIC bucket only (screenshots, playbooks, day files) ---
      # Database backups use R2_BACKUP_BUCKET, a separate PRIVATE bucket, and are
      # made by the scheduled task on your own machine -- they are not set here.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

      # --- Optional: AI analysis (leave unset to keep the rule-based summary) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
